[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "anonywiz"
dynamic = ["version"]
description = "Steuererklärungen, Lohn- und PK-Ausweise lokal anonymisieren (echte Schwärzung via PyMuPDF)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["pymupdf", "zxing-cpp", "numpy"]

[project.optional-dependencies]
ner = ["spacy"]
dev = ["pytest", "pytest-cov"]

[project.scripts]
anonywiz = "anonywiz:main"

[tool.setuptools]
py-modules = ["anonywiz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.setuptools.dynamic]
version = { attr = "anonywiz.__version__" }
