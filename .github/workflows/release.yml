name: Release

# Release: git tag v<version aus pyproject.toml> && git push --tags
# Trockenlauf ohne Release: Actions -> Release -> Run workflow
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  dist:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tag muss zur Version in pyproject.toml passen
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          python - <<'PY'
          import os, tomllib
          version = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v")
          assert tag == version, f"Tag v{tag} != pyproject-Version {version}"
          PY
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binaries:
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - name: Standalone-Programm bauen
        shell: bash
        run: |
          pyinstaller --onefile --noconfirm --name anonywiz \
            --collect-submodules zxingcpp --collect-binaries zxingcpp anonywiz.py
      - name: Smoke-Test
        shell: bash
        run: |
          ./dist/anonywiz --version
          python -c "import pymupdf; d=pymupdf.open(); p=d.new_page(); p.insert_text((72,100),'AHV 756.1234.5678.97'); d.save('smoke.pdf')"
          ./dist/anonywiz smoke.pdf --no-ner --no-preview | grep "nichts Sensibles mehr gefunden"
      - name: Umbenennen
        shell: bash
        run: |
          mkdir out
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/anonywiz.exe "out/anonywiz-${{ matrix.name }}.exe"
          else
            mv dist/anonywiz "out/anonywiz-${{ matrix.name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: out/*

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [dist, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Prüfsummen
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: GitHub Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
