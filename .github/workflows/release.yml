name: Release

# Release via the Actions UI:  Actions -> Release -> Run workflow
#   bump = patch | minor | major   raises the version in anonywiz.py (major.minor.patch)
#   bump = current                 releases the version as it is in the code right now
#   version = x.y.z                optional: exact version instead of bump
#   dry_run = true                 only builds and tests, no commit, tag or release
# The workflow commits the new version to the branch, creates the tag vX.Y.Z
# and publishes the GitHub release with wheel, sdist and binaries.
#
# Alternatively, tag yourself (git tag vX.Y.Z && git push --tags); the tag must match
# the version in anonywiz.py.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump (major.minor.patch)"
        type: choice
        options: [patch, minor, major, current]
        default: patch
      version:
        description: "Optional: exact version x.y.z (overrides bump)"
        type: string
        required: false
      dry_run:
        description: "Only build and test; do not commit, tag or publish"
        type: boolean
        default: false
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.v.outputs.version }}
      sha: ${{ steps.v.outputs.sha }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Determine and commit the version
        id: v
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
          DRY: ${{ inputs.dry_run }}
        run: |
          python - <<'PY'
          import os, re, subprocess

          SEMVER = re.compile(r"^(\d+)\.(\d+)\.(\d+)$")
          src = open("anonywiz.py", encoding="utf-8").read()
          cur = re.search(r'^__version__ = "([^"]+)"', src, re.M).group(1)
          out = open(os.environ["GITHUB_OUTPUT"], "a")

          def sh(*a):
              return subprocess.run(a, check=True, capture_output=True, text=True).stdout.strip()

          if os.environ["GITHUB_REF_TYPE"] == "tag":
              version = os.environ["GITHUB_REF_NAME"].removeprefix("v")
              assert version == cur, f"Tag v{version} does not match version {cur} in anonywiz.py"
              assert SEMVER.match(version), f"Version {version} is not major.minor.patch"
              print(f"Tag release {version}")
              out.write(f"version={version}\nsha={os.environ['GITHUB_SHA']}\npublish=true\n")
              raise SystemExit

          exact = os.environ["EXACT"].strip().removeprefix("v")
          bump = os.environ["BUMP"]
          dry = os.environ["DRY"] == "true"
          assert SEMVER.match(cur), f"Current version {cur} is not major.minor.patch"
          major, minor, patch = map(int, SEMVER.match(cur).groups())
          if exact:
              assert SEMVER.match(exact), f"'{exact}' is not major.minor.patch"
              version = exact
          elif bump == "major":
              version = f"{major + 1}.0.0"
          elif bump == "minor":
              version = f"{major}.{minor + 1}.0"
          elif bump == "patch":
              version = f"{major}.{minor}.{patch + 1}"
          else:
              version = cur

          if dry:
              print(f"Dry run: would publish {version} (source stays unchanged)")
              out.write(f"version={version}\nsha={sh('git', 'rev-parse', 'HEAD')}\npublish=false\n")
              raise SystemExit

          assert not sh("git", "tag", "-l", f"v{version}"), f"Tag v{version} already exists"
          if version != cur:
              open("anonywiz.py", "w", encoding="utf-8").write(
                  re.sub(r'^__version__ = "[^"]+"', f'__version__ = "{version}"', src, count=1, flags=re.M))
              sh("git", "config", "user.name", "github-actions[bot]")
              sh("git", "config", "user.email", "41898282+github-actions[bot]@users.noreply.github.com")
              sh("git", "commit", "-am", f"Release v{version}")
              sh("git", "push", "origin", f"HEAD:{os.environ['GITHUB_REF_NAME']}")
          out.write(f"version={version}\nsha={sh('git', 'rev-parse', 'HEAD')}\npublish=true\n")
          print(f"Release {version} @ {sh('git', 'rev-parse', 'HEAD')}")
          PY

  test:
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q

  dist:
    needs: [prepare, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  binaries:
    needs: [prepare, test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
          - os: windows-latest
            name: windows-x86_64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install . pyinstaller
      - name: Build standalone program
        shell: bash
        run: |
          pyinstaller --onefile --noconfirm --name anonywiz \
            --collect-submodules zxingcpp --collect-binaries zxingcpp anonywiz.py
      - name: Smoke-Test
        shell: bash
        run: |
          ./dist/anonywiz --version
          python -c "import pymupdf; d=pymupdf.open(); p=d.new_page(); p.insert_text((72,100),'AHV 756.1234.5678.97'); d.save('smoke.pdf')"
          ./dist/anonywiz smoke.pdf --no-ner --no-preview | grep "nothing sensitive found"
      - name: Rename
        shell: bash
        run: |
          mkdir out
          if [ "${{ runner.os }}" = "Windows" ]; then
            mv dist/anonywiz.exe "out/anonywiz-${{ matrix.name }}.exe"
          else
            mv dist/anonywiz "out/anonywiz-${{ matrix.name }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.name }}
          path: out/*

  release:
    if: needs.prepare.outputs.publish == 'true'
    needs: [prepare, dist, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          fetch-depth: 0   # full history and all tags, needed for the changelog
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        run: cd artifacts && sha256sum * > SHA256SUMS.txt
      - name: Build release notes from the commit list
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          # previous release = nearest version tag before this commit (none for the first release)
          PREV=$(git describe --tags --abbrev=0 --match 'v[0-9]*' "${SHA}^" 2>/dev/null || true)
          if [ -n "$PREV" ]; then RANGE="$PREV..$SHA"; else RANGE="$SHA"; fi
          {
            echo "## Changes"
            echo
            # all commits since the previous release, except the automatic version bumps
            git log --no-merges --invert-grep --grep='^Release v[0-9]' \
              --pretty='format:- %s (%h, %an)' "$RANGE"
            echo
            echo
            if [ -n "$PREV" ]; then
              echo "Full changelog: https://github.com/$GITHUB_REPOSITORY/compare/$PREV...v$VERSION"
            fi
          } > notes.md
          cat notes.md
      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.prepare.outputs.version }}
          SHA: ${{ needs.prepare.outputs.sha }}
        run: |
          # --target creates the tag vX.Y.Z on the tested commit (an existing tag is reused)
          gh release create "v$VERSION" artifacts/* \
            --repo "$GITHUB_REPOSITORY" --target "$SHA" \
            --title "v$VERSION" --notes-file notes.md
